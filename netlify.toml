[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# 1. Route frontend /api/* calls to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. React Router SPA fallback (ensures /calendar, /secret, etc. do not 404 on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/wallpapers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/moods/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache Service Worker so clients always receive instant updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
